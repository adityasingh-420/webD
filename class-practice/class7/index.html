<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #box{
            width: 1500px;
            height: 300px;
            background-color: rgb(179, 0, 0);
            transition: 2s;
            border: 2px;
            
        }

        #box:hover{
            background-color: rgb(248, 103, 103);
            border-radius: 50%;
            background-image: linear-gradient(100deg,red,yellow,orange,pink,green);
        }
    </style>
</head>
<body>
    <div id="box"></div>
    
</body>
</html>
