<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            
        }
        #parent{
           
            height: 100vh;
            align-content: center;
            display: grid;
            grid-template-columns:250px 250px 250px 250px;
            grid-template-rows: 250px 250px 250px ;
            gap:15px
            

        }

        #webpage{
            padding-left: 200px;
            position: relative;
            background-color: black;
            
        }

        .photo{
            
            border-radius: 20px;
            height: 100%;
            width: 100%;
            color: aliceblue;
            position: relative;
            
        }

        #content{
            color: aliceblue;
        }
        #a{
            grid-column: 1/5;
            
        }
        #f{
            grid-column: 1/3;
        }

        img{
            height: 100%;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            transition: 2s;
        }

       .child{
        position: absolute;
        top: 200px;
        left: 50px;
        opacity: 0;
        transition: 1s;
        font-size: 25px;
       }
       .photo img:hover{
        opacity: 1;
        object-fit: cover;
       }
       .photo:hover .child{
        opacity: 3;
       }

       h5{
        opacity: 0.5;
       }



    </style>
</head>
<body>
    <div id="webpage">
        <div id="content">
        <h5>My Collection</h5>
        <h1>Moments.</h1>
        <h5>A collection of places, people and memories</h5>
    </div>
    
    <div id="parent">
        <div id="a" class="photo"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8bGFuZHNjYXBlfGVufDB8fDB8fHww"><div class="child">photo0</div></div>
        <div id="b" class="photo"><img src="https://plus.unsplash.com/premium_photo-1676496046182-356a6a0ed002?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bGFuZHNjYXBlfGVufDB8fDB8fHww"><div class="child">photo1</div></div>
        <div id="c" class="photo"><img src="https://images.unsplash.com/photo-1790180032080-e730ca504a99?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDExfDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D"><div class="child">photo2</div></div>
        <div id="d" class="photo"><img src="https://images.unsplash.com/photo-1790791196732-cc81a2b29f51?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDE0fDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D"><div class="child">photo3</div></div>
        <div id="e" class="photo"><img src="https://images.unsplash.com/photo-1791133052453-aaa8d29a2840?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDIyfDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D"><div class="child">photo4</div></div>
        <div id="f" class="photo"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bGFuZHNjYXBlfGVufDB8fDB8fHww"><div class="child">photo5</div></div>
        <div id="g" class="photo"><img src="https://images.unsplash.com/photo-1790901570117-8e476ca122c7?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDUxfDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D"><div class="child">photo6</div></div>
        <div id="h" class="photo"><img src="https://images.unsplash.com/photo-1790516476481-4653835d765b?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDU2fDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D"><div class="child">photo7</div></div>
    </div>

</body>
</html>
