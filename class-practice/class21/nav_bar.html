<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #nav{
            width: 100%;
            height: 100px;
            background-color: black;
            border-radius: 40px;


            color: rgb(255, 255, 255);
            display: flex ;
            align-items: center;
            justify-content: start;
            justify-content: space-between;

        }

        #content{
           height: 100px;
           width: 60%;
           display:flex;
           justify-content: end;
           align-items: center;
           justify-content: space-between;
           
        

        }

        a{
            color: aliceblue;
            text-decoration: none;
            margin-left: 100px;
            /* width: 300px; */
           
        }

        button{
            background-color: rgb(226, 226, 0);
            color: rgb(3, 5, 6);
            margin-right: 20px;
            border-radius: 50px;
            width: 70px;
            height: 30px;

        }
        #logo{
            margin-left: 13px;
        }

         @media screen and (max-width:400px){
            #nav{
                height: 100vh;
                width: 100px;
                display: flex;
                align-items: flex-start;
            }

            #a{
                
                position: relative;
                top: 50px;
                right: 160px;
            }
            #b{
                
                position: relative;
                top: 150px;
                right: 300px;
            }
            #c{
                
                position: relative;
                top: 250px;
                right: 440px;
            }
            #d{
                
                position: relative;
                top: 750px;
                right: 500px;

            }

            }

         
    </style>
</head>
<body>
    
    <div id="nav">
        <div id="logo"> <h2>LOGO</h2></div>
        <div id="content">
            <div >
                <a id="a" href="">About</a>
            </div>
            <div>
                 <a id="b" href="">Social</a>
            </div>
            <div>
                 <a id="c">Connect</a>
            </div>
            <div>
                 <button id="d">Login</button>
            </div>
        </div>
    </div>
    
</body>
</html>
