<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid{
            
            border: 2px solid rgb(0, 0, 0);
            height: 100%;
            width: 100%;

        }
        #parent{
            height: 100vh;
            border: 2px solid;
            display: grid;
            grid-template-columns: 400px 400px 400px;
            grid-template-rows: 400px 400px 400px;
            gap: 10px;
            
        }
        img{
            height: 100%;
            width: 100%;
        }
        
        #one{
            grid-row: 2/3;
            /* grid-column: ; */
        }
        #two{
            grid-column: 1/4;
        }

        

        
        
    </style>
</head>
<body>

    <div id="parent">
        <div id="one" class="grid"><img src="https://images.unsplash.com/photo-1789758489828-f891985850a5?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxfHx8ZW58MHx8fHx8"></div>
        <div id="two" class="grid"><img src="https://plus.unsplash.com/premium_photo-1790852558626-f52e07293514?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8"></div>
        <div id="three" class="grid"><img src="https://images.unsplash.com/photo-1764548430775-ac26f39e3412?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw1fHx8ZW58MHx8fHx8" ></div>
        <div id="four" class="grid"><img src="https://images.unsplash.com/photo-1791114942775-5af7c5fb714c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw0fHx8ZW58MHx8fHx8"></div>
        <div id="five" class="grid"><img src="https://plus.unsplash.com/premium_photo-1764028979247-58d20965c7cf?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw2fHx8ZW58MHx8fHx8"></div>
        <div id="six" class="grid"><img src="https://images.unsplash.com/photo-1790997086052-1aa2b246f076?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw3fHx8ZW58MHx8fHx8"></div>
        
    </div>
    
</body>
</html>
