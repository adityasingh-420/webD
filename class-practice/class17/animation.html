<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: red;
        }
        div:hover{
            animation-name:firstAnimation;
            animation-duration: 5s;
        }
        @keyframes firstAnimation{
            0%{
                background-color: aqua;
                border-radius: 10%;
            }
            20%{
                background-color: blue;
                border-radius: 100%;
            }
            30%{
                background-color: aqua;
                border-radius: 10%;
            }
            50%{
                background-color: aquamarine;
                height: 500px;
                width: 500px;
            }
            60%{
                background-color: blue;
                border-radius: 100%;
            }
            70%{
                background-color: aquamarine;
                height: 200px;
                width: 400px;
            }

            100%{
                background-color: blue;
                border-radius: 100%;
            }

        }
    </style>
</head>
<body>

    <div></div>
    
</body>
</html>
