<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            perspective: 900px;
        }
        #main{
            width: 700px;
            height: 900px;
            margin: 200px auto;
            position: relative;
            transition: 3s;
            transform-style: preserve-3d;
        }
        #cardA{
            width: 100%;
            height: 50%;
            background-color: blueviolet;
            position: absolute;
            z-index: 1;
            backface-visibility: hidden;
        }
        #cardB{
            width: 100%;
            height: 50%;
            background-color: chartreuse;
            position: absolute;
            transform: rotateY(180deg);

            
            
        }

        #main:hover{
            transform: rotateY(180deg);
        }

        img{
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="main">
