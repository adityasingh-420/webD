<!DOCTYPE html>

        #nav{

            display: flex;

        }

            left: 30px;

        }
        #bSymbol{

        }

        #info{

        }

        .navbar{

        #navbutton{

        }

        }

            width: 200px;

            border: 1px solid grey;
        }

        .firstP{
            font-size: 20px;
            position: relative;
            bottom: 20px;

        }

        .frontbutton{
            height: 40px;
            width: 160px;
            border-radius: 50px;
            border: 1px solid black ;
        }

        #frontB1{
            background-color: black;
            color: aliceblue;
        }
        #frontB2{
            background-color: aliceblue;
            color: black;
        }

        #animation{
            background-color: aqua;
            height: 400px;
            width: 50vw;
            display: flex;
            align-items: 500px;

        }

</head>
<body>
    <div id="nav">
